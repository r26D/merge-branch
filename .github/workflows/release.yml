name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/r26d/merge-branch/merge-branch:${{ steps.version.outputs.tag }}
            ghcr.io/r26d/merge-branch/merge-branch:latest

  update-action:
    needs: publish-docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update action.yml image reference
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          sed -i "s|docker://ghcr.io/r26d/merge-branch/merge-branch:v[^\"]*|docker://ghcr.io/r26d/merge-branch/merge-branch:${VERSION}|" action.yml

      - name: Update README version references
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          sed -i "s|r26d/merge-branch@v[0-9.]*|r26d/merge-branch@${VERSION}|g" README.md

      - name: Commit and push updated references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${GITHUB_REF#refs/tags/}"
          git add action.yml README.md
          git diff --cached --quiet || git commit -m "Update action image and docs to ${VERSION}"
          git push
