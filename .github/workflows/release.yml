name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  update-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update README version references
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          sed -i "s|r26d/merge-branch@v[0-9.]*|r26d/merge-branch@${VERSION}|g" README.md

      - name: Commit and push updated references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${GITHUB_REF#refs/tags/}"
          git add README.md
          git diff --cached --quiet || git commit -m "Update docs to ${VERSION}"
          git push
